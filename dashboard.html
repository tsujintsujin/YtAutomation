<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YtAutomation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf5ee; --side: #fbf6f0; --surface: #ffffff; --input: #fdf3e8;
  --text: #0f1b33; --muted: rgba(15,27,51,.58); --soft: rgba(15,27,51,.75); --line: rgba(15,27,51,.09);
  --accent: #ff7a1a; --accent-soft: #ffeedf; --accent-line: rgba(255,122,26,.45);
  --green: #16a34a; --red: #dc2626; --blue: #2563eb; --grey: #64748b;
  --shadow: 0 1px 2px rgba(15,27,51,.04), 0 6px 20px rgba(15,27,51,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1322; --side: #121a2b; --surface: #151d2e; --input: #1a2336;
    --text: #e8edf7; --muted: rgba(232,237,247,.58); --soft: rgba(232,237,247,.75); --line: rgba(232,237,247,.13);
    --accent-soft: rgba(255,122,26,.14); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1322; --side: #121a2b; --surface: #151d2e; --input: #1a2336;
  --text: #e8edf7; --muted: rgba(232,237,247,.58); --soft: rgba(232,237,247,.75); --line: rgba(232,237,247,.13);
  --accent-soft: rgba(255,122,26,.14); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: Poppins, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
code { font-size: 12px; background: var(--input); border-radius: 5px; padding: 0 4px; overflow-wrap: anywhere; }

/* ---------- shell: sidebar = where you are (channels, pipeline pages); top bar = what is running ---------- */
.side { position: fixed; inset: 0 auto 0 0; width: 228px; background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 12px 10px; z-index: 30; overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; font-weight: 800; font-size: 15px; letter-spacing: -.02em; }
.logo b { color: var(--accent); font-weight: 800; }
.logo .mark { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.logo .mark svg { width: 14px; height: 14px; fill: #fff; stroke: none; }
.nav h5 { margin: 14px 10px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--soft); margin-bottom: 1px; min-width: 0; }
.nav a:hover { background: var(--accent-soft); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.nav a .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a .c { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav a .n { font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 99px; padding: 0 7px; }
.nav a .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s infinite; flex: none; }
.nav a .bad { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex: none; }
.side .foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; }
.main { margin-left: 228px; min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 20; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 24px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top h2 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.top h2 a:hover { color: var(--accent); }
.top h2 b { color: var(--text); font-weight: 700; }
.top .sp { flex: 1; }
.ib { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center;
  cursor: pointer; color: var(--soft); flex: none; }
.ib:hover { color: var(--accent); border-color: var(--accent-line); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px;
  background: var(--surface); font-size: 12px; font-weight: 600; white-space: nowrap; }
a.pill:hover { border-color: var(--accent-line); }
.menu { display: none; }
.page { max-width: 1480px; margin: 0 auto; padding: 26px 32px 80px; }

/* ---------- page header: title left, the one action right, status sentence under it ---------- */
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 6px; }
.ph h1 { margin: 0; font-size: clamp(26px, 2.4vw, 36px); font-weight: 800; letter-spacing: -.03em; line-height: 1.12; }
.ph .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; flex: none; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
.back:hover { color: var(--accent); }
.nowline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 18px; font-size: 14px; color: var(--soft); }
.nowline b { color: var(--text); font-weight: 700; }
.nowline .actions { margin-left: auto; }

/* ---------- section tabs (a page's parts) and filter chips (a list's subsets) look different on purpose ---------- */
.subtabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 0 0 18px; overflow-x: auto; scrollbar-width: none; }
.subtabs a, .subtabs button { border: 0; background: none; padding: 10px 0 11px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.subtabs a:hover, .subtabs button:hover { color: var(--text); }
.subtabs .on { color: var(--text); border-bottom-color: var(--accent); }
.subtabs .c { font-weight: 600; color: var(--muted); font-size: 12px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--muted); width: min(340px, 100%); }
.search:focus-within { border-color: var(--accent-line); }
.search input { flex: 1; border: 0; outline: 0; background: none; font-size: 13px; color: var(--text); min-width: 0; }
kbd { white-space: nowrap; font: 600 10px Poppins, sans-serif; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--surface); font-size: 12px; font-weight: 600; color: var(--soft); cursor: pointer; white-space: nowrap; }
.chips button:hover { border-color: var(--accent-line); }
.chips button .c { color: var(--muted); font-variant-numeric: tabular-nums; }
.chips button.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.chips button.on .c { color: inherit; opacity: .75; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent-line); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.05); color: #fff; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.btn.danger:hover:not(:disabled) { background: var(--red); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12px; }
.btn.icon { width: 38px; padding: 0; justify-content: center; }
.btn.sm.icon { width: 32px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
.card-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.015em; line-height: 1.3; }
.card-h p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
.card-h > .actions, .card-h > .badge, .card-h > .st { margin-left: auto; }
.badge { min-width: 26px; height: 24px; padding: 0 8px; border-radius: 99px; background: var(--input); border: 1px solid var(--line);
  font-size: 12px; font-weight: 700; color: var(--muted); display: inline-grid; place-items: center; }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 20px; align-items: start; }

/* ---------- status chips, progress ---------- */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
  background: var(--input); border: 1px solid var(--line); white-space: nowrap; }
.st .dot { width: 6px; height: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--grey); flex: none; }
.dot.on { background: var(--green); } .dot.off { background: var(--red); } .dot.idle { background: var(--grey); }
.st.running { color: var(--accent); } .st.running .dot { background: var(--accent); animation: pulse 1.4s infinite; }
.st.done, .st.made { color: var(--green); } .st.done .dot, .st.made .dot { background: var(--green); }
.st.failed, .st.error { color: var(--red); } .st.failed .dot, .st.error .dot { background: var(--red); }
.st.waiting, .st.limits { color: var(--blue); } .st.waiting .dot, .st.limits .dot { background: var(--blue); }
.st.skip { color: var(--muted); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .st.running .dot, .nav a .live { animation: none; } }
.bar { height: 5px; border-radius: 9px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; }
.bar.done i { background: var(--green); }
.ticks { display: flex; flex-wrap: wrap; gap: 4px; }
.tick { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tick.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.tick.now { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.tick.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
/* the 3 stages of a video as one compact line: Voice — Pictures — Video */
.steps { display: flex; align-items: center; gap: 0; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; row-gap: 6px; }
.steps li { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.steps li + li::before { content: ""; width: 28px; height: 2px; background: var(--line); margin: 0 10px; }
.steps li.ok + li::before { background: color-mix(in srgb, var(--green) 55%, transparent); }
.steps .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800;
  background: var(--input); border: 2px solid var(--line); color: var(--muted); }
.steps li.ok .n { background: color-mix(in srgb, var(--green) 18%, var(--surface)); border-color: var(--green); color: var(--green); }
.steps li.now .n { background: var(--accent); border-color: var(--accent); color: #fff; }
.steps li .m { font-weight: 500; color: var(--muted); }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 14px; margin-bottom: 16px;
  border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 9%, var(--surface)); }
.banner > .i { color: var(--red); margin-top: 3px; }
.banner h4 { margin: 0; font-size: 14px; font-weight: 700; color: var(--red); }
.banner p { margin: 2px 0 0; font-size: 13px; color: var(--soft); }
.banner .end { margin-left: auto; display: flex; gap: 8px; flex: none; }
.banner .bx { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

/* ---------- a channel's video list: one row per video, grouped by status ---------- */
.grp { margin-bottom: 22px; }
.grp-h { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; flex-wrap: wrap; }
.grp-h h3 { margin: 0; font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.grp-h h3 .c { font-size: 13px; color: var(--muted); font-weight: 600; }
.grp-h p { margin: 0; font-size: 12px; color: var(--muted); flex: 1 1 260px; }
.grp-h .actions { margin-left: auto; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.qpick { flex: none; width: 44px; align-self: stretch; display: grid; place-items: center; cursor: pointer; border-right: 1px solid var(--line); }
.qpick:hover { background: var(--input); }
.qpick input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.qpick input:disabled { cursor: not-allowed; }
.vrow { flex: 1; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) 240px 170px; gap: 16px; align-items: center; padding: 10px 16px; }
.vrow.wide { grid-template-columns: auto minmax(0, 1fr) 240px 300px; }
.vrow:hover { background: var(--input); }
.cv { width: 36px; height: 64px; border-radius: 7px; background: var(--input) center/cover; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); }
.cv.land { width: 96px; height: 54px; }
.vt { min-width: 0; }
.vt h4 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; line-height: 1.35; overflow-wrap: anywhere; }
.vt p { margin: 2px 0 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.vt p.bad { color: var(--red); }
.vprog { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.vmeta { text-align: right; font-size: 12px; color: var(--muted); min-width: 0; }
.vmeta b { display: block; font-size: 14px; color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
.yts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.yt { aspect-ratio: 16/9; border-radius: 5px; border: 1px solid var(--line); background: var(--input) center/cover; }
.yt.missing { border: 1.5px dashed var(--line); background: none; display: grid; place-items: center; color: var(--muted); font-size: 10px; font-weight: 600; }
.yts .none { grid-column: 1/-1; color: var(--muted); font-size: 12px; text-align: right; }

/* ---------- facts (label / value rows), settings grid, markdown ---------- */
.facts { list-style: none; margin: 0; padding: 4px 18px 10px; }
.facts li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.facts li:last-child { border-bottom: 0; }
.facts li span:first-child { color: var(--muted); }
.facts li b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.side-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 18px 16px; }
.sets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.sets div { background: var(--surface); padding: 12px 18px; min-width: 0; }
.sets small { display: block; font-size: 12px; color: var(--muted); }
.sets b { display: block; font-size: 14px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.sets .full { grid-column: 1/-1; }
.sets .full b { font-weight: 400; font-size: 13px; color: var(--soft); }
.md { padding: 6px 20px 18px; font-size: 13px; color: var(--soft); max-width: 90ch; }
.md h4 { margin: 16px 0 4px; font-size: 14px; font-weight: 700; color: var(--text); }
.md ul { margin: 4px 0; padding-left: 18px; }
.md li { margin: 3px 0; }
.md p { margin: 4px 0; }
.md.story { padding-top: 16px; font-size: 15px; line-height: 1.7; }
.md.story p { margin: 0 0 12px; color: var(--text); max-width: 68ch; }

/* ---------- one video ---------- */
.statusbar { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin: 12px 0 18px; }
.statusbar .nowline { margin: 0; }
.vp { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 20px; align-items: start; margin-bottom: 22px; }
.vp.tall { grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1fr); }
.vp.tall.np { grid-template-columns: 300px minmax(0, 560px); }
.vp .card { margin: 0; }
.vp .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
video { width: 100%; display: block; background: #000; aspect-ratio: 16/9; }
.vp.tall video { aspect-ratio: 9/16; max-height: 76vh; }
.cover { display: block; width: 96px; aspect-ratio: 9/16; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--input); }
.ready { display: flex; gap: 16px; padding: 14px 18px 4px; }
.ready .facts { padding: 0; flex: 1; }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.imgs.tall { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
.im { position: relative; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: var(--input) center/cover; cursor: pointer;
  border: 1px solid var(--line); padding: 0; }
.imgs.tall .im { aspect-ratio: 9/16; }
.im:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.im .no { position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 700; background: rgba(12,19,34,.72); color: #fff; padding: 0 6px; border-radius: 6px; }
.im.missing { border: 1.5px dashed var(--line); background: none; display: grid; place-items: center; color: var(--muted); font-size: 12px; font-weight: 600; }
.im.missing .no { display: none; }
/* "Redo images" mode: the whole picture is the tap target; a ring when not picked, a filled check when picked */
.redohint { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.redohint .i { color: var(--accent); }
.im .tk { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid #fff; background: rgba(12,19,34,.55); color: transparent; transition: background .15s, border-color .15s; }
.im .tk .i { width: 14px; height: 14px; }
.imgs.picking .im:not(.missing):not(.sel):hover .tk { background: rgba(12,19,34,.8); }
.im.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.im.sel .tk { background: var(--accent); border-color: var(--accent); color: #fff; }
.imgs.picking .im.missing { opacity: .4; cursor: not-allowed; }
.ytgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.ytc { display: flex; flex-direction: column; gap: 6px; }
.ytc b { font-size: 12px; font-weight: 600; color: var(--soft); }
.imw { position: relative; }
.imw .im { display: block; width: 100%; }
.pick { position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: rgba(12,19,34,.72); cursor: pointer; }
.pick input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.ytc.ok .im { outline: 3px solid var(--accent); outline-offset: 1px; }

/* ---------- analytics ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.kpis div { background: var(--surface); padding: 14px 18px; min-width: 0; }
.kpis small { display: block; font-size: 12px; color: var(--muted); }
.kpis b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpis em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--green); margin-left: 4px; letter-spacing: 0; }
.delta { font-size: 11px; font-weight: 600; color: var(--green); display: block; }
.delta.dn { color: var(--red); }
.notes { list-style: none; margin: 0; padding: 10px 18px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.notes li { margin: 2px 0; }
.perf .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 0; }

dialog .prompt { font-size: 12px; color: var(--soft); background: var(--input); border-radius: 12px; padding: 10px 12px; max-height: 160px; overflow: auto; white-space: pre-wrap; margin: 0 0 14px; }
dialog .tx { font-size: 14px; line-height: 1.65; color: var(--soft); background: var(--input); border-radius: 12px; padding: 12px 14px; max-height: 55vh; overflow: auto; white-space: pre-wrap; margin: 0 0 14px; }
dialog .edtx { display: block; width: 100%; height: 68vh; resize: vertical; font: 13px/1.6 ui-monospace, Consolas, monospace; color: var(--text); background: var(--input); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border: 0; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50; background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.2); }

}

</div>

<dialog id="dlg"></dialog>

<script>

  play: svg('<path d="m6 4 14 8-14 8z"/>'),

  alert: svg('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),

  redo: svg('<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>'),

  ext: svg('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/>'),
  search: svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),
  mic: svg('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>'),

const STATUS = { running: 'Running', waiting: 'Waiting', failed: 'Failed', done: 'Done', draft: 'Being written', posted: 'Scheduled post' };
const ORDER = ['running', 'failed', 'waiting', 'draft', 'done', 'posted'];
const SUB = { running: 'Being made right now.', waiting: 'Script ready, not made yet.',
  failed: 'The last try stopped with an error.',
  done: 'MP4 made, not on YouTube yet. Claude schedules these one a day.', draft: 'Claude is still writing it. It is approved as soon as it is finished (no approval step).',
  posted: 'Uploaded to YouTube and scheduled. Never uploaded again.' };

let qPick = new Set();   // Waiting Shorts ticked for Run selected (kept across the 5 s redraws)
let S = null, filter = 'all', query = '', V = null, vFilter = 'all', vTab = '', chan = '', srcWeek = {};

// ---------- helpers ----------
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Dash': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'bad answer from the dashboard server' }));

}
function toast(msg, bad) {

}
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : m ? `${m} min` : `${s} s`; };
const clock = s => s == null ? '–' : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const when = iso => { const d = new Date(iso); const today = new Date().toDateString() === d.toDateString();
  return (today ? '' : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ') + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };
const day = ymd => new Date(ymd + 'T12:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
const num = n => n == null ? '–' : Number(n).toLocaleString();
const pct = n => n == null ? '–' : `${Number(n).toFixed(1)}%`;
const st = (k, label) => `<span class="st ${k}"><i class="dot"></i>${esc(label || STATUS[k] || k)}</span>`;
const bar = v => `<div class="bar ${v.made >= v.total && v.total ? 'done' : ''}"><i style="width:${v.total ? Math.round(100 * v.made / v.total) : 0}%"></i></div>`;
const chanOf = key => S.channels.find(c => c.key === key) || {};
const isShort = v => (chanOf(v.channel).settings || {}).pipeline === 'shorts';
const tall = c => { const f = (c.settings || {}).format || {}; return f.height > f.width; };
const short = s => s.length > 70 ? s.slice(0, 68) + '…' : s;
const title = slug => (S.videos.find(v => v.slug === slug) || { title: slug }).title;
// A Short is made in 3 parts, each by its own run, side by side (n8n "Shorts: run queue"): voice, pictures, video.
const PARTS = [['voice', 'Voice'], ['pictures', 'Pictures'], ['finish', 'Video']];
const PART_NAME = { voice: 'Voice', pictures: 'Pictures', finish: 'Video' };
const ended = (v, k) => ((v.parts || {})[k] || {}).outcome;
function partTicks(v) {
  const now = v.now || {}, bad = k => ['failed', 'stopped'].includes(ended(v, k));
  const t = [
    now.voice ? ['now', now.voice === 'queued' ? 'voice: starting' : `voice ${v.voiceLines || 0}/${v.total}`]
      : v.voiceDone ? ['ok', '✓ voice'] : bad('voice') ? ['bad', `voice ${ended(v, 'voice')}`] : ['', 'voice'],
    now.pictures ? ['now', now.pictures === 'queued' ? 'pictures: starting' : `pictures ${v.made}/${v.total}`]
      : v.total && v.made >= v.total ? ['ok', '✓ pictures'] : bad('pictures') ? ['bad', `pictures ${ended(v, 'pictures')}`] : ['', `pictures ${v.made}/${v.total}`],
    now.finish ? ['now', now.finish === 'queued' ? 'video: starting' : 'rendering']

  ];
  return t.map(([k, l]) => `<span class="tick ${k}">${esc(l)}</span>`).join('');
}
const ticks = v => `<div class="ticks">${isShort(v) && v.script ? partTicks(v) : [['voice', v.voiceDone], ['subtitles', v.srt], ['MP4', v.mp4]].map(([n, ok]) => `<span class="tick ${ok ? 'ok' : ''}">${ok ? '✓ ' : ''}${n}</span>`).join('')}</div>`;
const runLabel = r => r.live ? ['running', 'Running'] : r.outcome === 'made' ? ['made', 'MP4 made'] : r.outcome === 'failed' ? ['failed', 'Failed']
  : r.outcome === 'voice' ? ['made', 'Voice made'] : r.outcome === 'pictures' ? ['made', 'Pictures made']
  : r.outcome === 'limits' ? ['limits', 'Out of credits'] : r.outcome === 'stopped' ? ['', 'Stopped'] : r.outcome === 'skipped' ? ['', 'Skipped']
  : r.status === 'error' ? ['error', 'Error'] : r.status === 'success' ? ['done', 'Finished'] : ['', r.status];
const pageHead = (h, sub, actions) => `<header class="ph"><div style="min-width:0"><h1>${h}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</header>`;

// ---------- shell ----------
// Local voice pages, not part of the video pipeline: key, name, port, what it is.
const APPS = [['kokoro', 'Kokoro', 7860, 'Kokoro text to speech: 28 voices, paste a script, get a WAV'],

function services() {
  const h = S.health;
  const out = [['n8n', h.n8n ? 'on' : ['starting', 'restarting'].includes(h.n8nState) ? 'idle' : 'off', h.n8nState || (h.n8n ? 'running' : 'down'), 'Runs every step of the pipeline.'],
    ['Bridge', h.bridge ? 'on' : 'off', h.bridge ? 'running' : 'down', 'Passes orders to the Gemini runner tab in Chrome.'],
    ['OpenCut', h.opencut ? 'on' : 'idle', h.opencut ? 'running' : 'idle', 'Starts by itself when a video is rendered.']];
  for (const [k, n, , tip] of APPS) { const a = h.apps?.[k] || {}; out.push([n, a.on ? 'on' : 'idle', a.on ? 'running' : a.starting ? 'starting' : 'down', tip.split(':')[1].trim()]); }

function shell() {
  const h = S.health, { p } = route(), r = S.run, lk = PARTS.map(x => x[0]).filter(k => (S.lanes || {})[k]), q = S.queue;
  const cur = p === 'video' && V ? V.channel : p === 'videos' ? C().key : '';

      return link('#/videos/' + encodeURIComponent(c.key), c.key === cur, ic.film, esc(c.name),
        (run ? '<i class="live" title="Being made now"></i>' : bad ? '<i class="bad" title="A video stopped with an error"></i>' : '') + `<span class="c">${vs.length}</span>`).replace('<a ', `<a title="${esc(c.name)}" `);
    }).join('')
    + '<h5>Pipeline</h5>'
    + link('#/live', p === 'live', ic.pulse, 'Live run', r || lk.length ? `<span class="n" title="${r ? '1 run going' : `${lk.length} part${lk.length === 1 ? '' : 's'} being made`}">${r ? 1 : lk.length}</span>` : '')
    + link('#/analytics', p === 'analytics', ic.chart, 'Analytics')
    + link('#/accounts', p === 'accounts', ic.users, 'Gemini accounts')
    + link('#/runs', p === 'runs', ic.list, 'Runs');
  const down = !h.n8n || !h.bridge, starting = ['starting', 'restarting'].includes(h.n8nState);
  $('#foot').innerHTML = link('#/system', p === 'system', ic.server, 'System',
      `<span class="dot ${!down ? 'on' : starting && h.bridge ? 'idle' : 'off'}" title="${!down ? 'n8n and the bridge are running' : !h.n8n ? `n8n ${h.n8nState || 'down'}` : 'Bridge down'}"></span>`)
    + `<a href="http://127.0.0.1:5678/workflow/ytrender00000001" target="_blank" rel="noopener">${ic.ext}<span class="nm">Open in n8n</span></a>`;
  $('#runPill').innerHTML = r ? `<span class="dot" style="background:var(--accent)"></span><span class="lbl">${esc(r.video ? r.video.title : r.slug || 'starting')}${r.video ? ` · ${r.video.made}/${r.video.total}` : ''}</span>`
    : lk.length || q ? `<span class="dot" style="background:var(--accent)"></span><span class="lbl">${lk.length ? lk.map(k => PART_NAME[k]).join(' + ') : 'Queue: checking'}${q ? ` · ${q.made ?? 0} of ${q.slugs.length} made` : ''}</span>`
    : robot() ? `<span class="dot off"></span><span class="lbl">Robot check</span>` : `<span class="dot idle"></span><span class="lbl">Nothing running</span>`;

// RULES.md -> HTML: headings, bullets, paragraphs, **bold**, `code`; everything escaped first
function md(t) {
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
  const out = [], flush = () => { if (li) out.push('<ul>' + li.map(x => `<li>${inl(x)}</li>`).join('') + '</ul>'); li = null; };
  let li = null;
  for (const line of t.split('\n')) {
    if (/^- /.test(line)) { li = li || []; li.push(line.slice(2)); continue; }
    if (/^\d+\. /.test(line)) { li = li || []; li.push(line.replace(/^(\d+)\. /, '$1. ')); continue; }
    if (li && /^\s+\S/.test(line)) { li[li.length - 1] += ' ' + line.trim(); continue; }
    flush();
    if (/^#{2,6} /.test(line)) out.push(`<h4>${inl(line.replace(/^#+ /, ''))}</h4>`);
    else if (line.trim() && !/^# /.test(line)) out.push(`<p>${inl(line)}</p>`);
  }
  flush();
  return out.join('');
}

// The stage a video being made is at, in plain words. A Short's parts can run at the same time (v.now says which);
// a YouTube Render video goes voice first, then pictures, then the edit.
function stage(v) {
  const now = v.now || {}, bits = [];
  if (now.voice) bits.push(now.voice === 'queued' ? 'voice starting' : `voice ${v.voiceLines || 0} of ${v.total} lines`);
  if (now.pictures) bits.push(now.pictures === 'queued' ? 'pictures starting' : `pictures ${v.made} of ${v.total}`);
  if (now.finish) bits.push(now.finish === 'queued' ? 'video starting' : 'putting the video together');
  if (bits.length) return 'Making the ' + bits.join(' and the ');
  if (!v.voiceDone) return `Making the voice: ${v.voiceLines || 0} of ${v.total} lines`;
  if (v.made < v.total) return `Making pictures: ${v.made} of ${v.total}`;
  return 'Putting the video together';
}

async function voiceApp(b) {
  const [k, n, port] = APPS.find(a => a[0] === b.dataset.app), url = `http://127.0.0.1:${port}/`;
  if (S.health.apps?.[k]?.on) return window.open(url, '_blank');
  const w = window.open('', '_blank');
  const say = t => { if (w && !w.closed) w.document.body.innerHTML = `<p style="font:16px system-ui;padding:24px">${t}</p>`; };
  if (w) { w.document.title = n; say(`Starting ${n}…`); }
  b.disabled = true;
  try { toast((await api('/api/app/start', { app: k })).message); } catch (err) { toast(err.message, true); w?.close(); return refresh(true); }
  for (let i = 0; i < 60; i++) {                       // up to 90 s (Chatterbox imports torch before the page answers)
    await new Promise(r => setTimeout(r, 1500));
    await refresh(true);
    if (S.health.apps?.[k]?.on) { if (w && !w.closed) w.location = url; else window.open(url, '_blank'); return; }
  }
  say(`${n} did not start in 90 s. Check its minimised window "${n} :${port}".`);
}

// ---------- loop ----------
let busy = false, lastSig = '', lastVSig = '', seq = 0;
async function refresh(force) {
  if (busy && !force) return;
  busy = true;
  const my = ++seq;                                   // an older answer arriving late must not overwrite a newer one
  try {
    const next = await api('/api/state');
    if (my !== seq) return;
    const sig = JSON.stringify({ ...next, now: 0 });
    const same = sig === lastSig;
    S = next; lastSig = sig;
    const { p, arg } = route();
    if (p === 'video') {
      // redraw only when this video changed, so a playing MP4 or an open grid is not rebuilt every 5 s
      shell();
      const v = await api('/api/video?slug=' + encodeURIComponent(arg));
      if (my !== seq) return;
      const sv = S.videos.find(x => x.slug === arg) || {};
      const vsig = JSON.stringify([v, sv.status, sv.now, S.going, S.health.n8n]);
      if (force || vsig !== lastVSig) await renderVideo(arg, true);
    } else if (same && !force) shell();
    else {                                            // keep the search box focused while typing, and the scroll
      const focus = document.activeElement && document.activeElement.id === 'q';
      const caret = focus && $('#q').selectionStart, y = scrollY;
      await render();
      scrollTo(0, y);
      if (focus && $('#q')) { $('#q').focus(); $('#q').setSelectionRange(caret, caret); }
    }
  } catch (e) { if (my === seq) toast('Dashboard server not answering: ' + e.message, true); }
  finally { if (my === seq) busy = false; }
}
window.addEventListener('hashchange', () => { const { p } = route(); if (p !== 'video') vTab = ''; scrollTo(0, 0); render(); });
$('#refresh').onclick = () => refresh(true);
$('#stopTop').onclick = () => act('stop');
$('#resumeTop').onclick = () => resumeQueue();
// Resume: a new queue with the videos the last one did not make, in the same order
async function resumeQueue() {
  const ql = S.queueLeft; if (!ql) return;
  if (!confirm(`The last queue stopped: ${ql.reason}.

Make these ${ql.slugs.length} one after another?

${ql.slugs.map((s, i) => `${i + 1}. ${title(s)}`).join('\n')}${/robot/i.test(ql.reason) ? "\n\nSolve Google's robot check in the Gemini window first." : ''}`)) return;
  try { toast((await api('/api/queue', { channel: ql.channel, slugs: ql.slugs })).message); } catch (e) { toast(e.message, true); }
  refresh(true);
}
$('#menuBtn').onclick = () => document.body.classList.toggle('nav-open');
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault();
  if ($('#q')) $('#q').focus(); else location.hash = '#/videos/' + encodeURIComponent(chan || ''); } });
$('#theme').onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
refresh(true);
setInterval(() => { if (!document.hidden && !$('#dlg').open) refresh(); }, 5000);
</script>
