<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YtAutomation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf5ee; --side: #fbf6f0; --surface: #ffffff; --input: #fdf3e8;
  --text: #0f1b33; --muted: rgba(15,27,51,.58); --soft: rgba(15,27,51,.75); --line: rgba(15,27,51,.09);
  --accent: #ff7a1a; --accent-soft: #ffeedf; --accent-line: rgba(255,122,26,.45);
  --green: #16a34a; --red: #dc2626; --blue: #2563eb; --grey: #64748b;
  --shadow: 0 1px 2px rgba(15,27,51,.04), 0 6px 20px rgba(15,27,51,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1322; --side: #121a2b; --surface: #151d2e; --input: #1a2336;
    --text: #e8edf7; --muted: rgba(232,237,247,.58); --soft: rgba(232,237,247,.75); --line: rgba(232,237,247,.13);
    --accent-soft: rgba(255,122,26,.14); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1322; --side: #121a2b; --surface: #151d2e; --input: #1a2336;
  --text: #e8edf7; --muted: rgba(232,237,247,.58); --soft: rgba(232,237,247,.75); --line: rgba(232,237,247,.13);
  --accent-soft: rgba(255,122,26,.14); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: Poppins, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---- shell ---- */
.side { position: fixed; inset: 0 auto 0 0; width: 196px; background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 12px 10px; z-index: 30; }
.logo { display: flex; align-items: center; gap: 9px; padding: 4px 6px 12px; font-weight: 800; font-size: 15px; letter-spacing: -.02em; }
.logo b { color: var(--accent); font-weight: 800; }
.logo .mark { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
.logo .mark svg { width: 14px; height: 14px; fill: #fff; stroke: none; }
.svc { border: 1px solid var(--line); background: var(--input); border-radius: 10px; padding: 9px 11px; margin-bottom: 14px; }
.svc div { white-space: nowrap; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
.svc div + div { margin-top: 3px; }
.svc strong { color: var(--text); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--grey); }
.dot.on { background: var(--green); } .dot.off { background: var(--red); } .dot.idle { background: var(--grey); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--soft); letter-spacing: .006em; margin-bottom: 2px; }
.nav a:hover { background: var(--accent-soft); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.nav a .n { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 99px; padding: 0 7px; }
.side .foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; }
.svc.yt { margin: auto 0 10px; }
.svc.js { margin: 0 0 10px; }
.svc.js + .foot { margin-top: 0; }
.svc .t { margin: 0 0 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--soft); }
.svc .btn { width: 100%; justify-content: center; margin-top: 8px; }
.main { margin-left: 196px; min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 20; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top h2 { font-size: 13px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sp { flex: 1; }
.qs { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px;
  background: var(--surface); color: var(--muted); font-size: 12px; width: 170px; }
.qs input { border: 0; outline: 0; background: none; width: 100%; font-size: 12px; }
kbd { white-space: nowrap; font: 600 10px Poppins, sans-serif; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--muted); }
.ib { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center;
  cursor: pointer; color: var(--soft); }
.ib:hover { color: var(--accent); border-color: var(--accent-line); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px;
  background: var(--surface); font-size: 12px; font-weight: 600; white-space: nowrap; }
.menu { display: none; }
.page { max-width: 1440px; margin: 0 auto; padding: 24px 28px 80px; }

/* ---- type ---- */
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
h1 { font-size: clamp(30px, 4.2vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.04; margin: 0 0 22px; }
h1 span { color: var(--muted); }
.muted { color: var(--muted); }

/* ---- controls ---- */
.search { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 18px; border: 1px solid var(--accent-line);
  border-radius: 14px; background: var(--input); margin-bottom: 14px; color: var(--muted); }
.search input { flex: 1; border: 0; outline: 0; background: none; font-size: 15px; color: var(--text); min-width: 0; }
.search .count { font-size: 12px; font-weight: 700; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs button { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 7px 12px; border-radius: 9px; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--soft); white-space: nowrap; }
.tabs button .c { color: var(--muted); font-weight: 600; }
.tabs button.on { background: var(--accent); color: #fff; }
.tabs button.on .c { color: rgba(255,255,255,.85); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent-line); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.05); color: #fff; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.btn.danger:hover:not(:disabled) { background: var(--red); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 30px; padding: 0 12px; font-size: 12px; }

/* ---- cards ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
.card-h { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.card-h h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.025em; line-height: 1.25; }
.card-h p { margin: 0; font-size: 13px; color: var(--muted); }
.card-h .badge { margin-left: auto; }
.tile { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.badge { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 99px; background: var(--input); border: 1px solid var(--line);
  font-size: 12px; font-weight: 700; color: var(--muted); display: inline-grid; place-items: center; }
.card-b { padding: 18px 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 22px; padding: 14px 20px 18px; }
.entry { display: flex; gap: 12px; padding: 10px; margin: 0 -10px; border-radius: 14px; cursor: pointer; min-width: 0; }
.entry:hover { background: var(--input); }
.vlist { padding: 8px 20px 12px; }
.vrow { display: flex; gap: 18px; align-items: center; margin: 0 -10px; }
.vrow .info { display: flex; gap: 12px; width: 300px; flex: none; min-width: 0; }
.yts { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.yt { aspect-ratio: 16/9; border-radius: 7px; border: 1px solid var(--line); background: var(--input) center/cover; }
.yt.missing { border: 1.5px dashed var(--line); background: none; display: grid; place-items: center; color: var(--muted); font-size: 11px; font-weight: 600; }
.yts .none { grid-column: 1/-1; color: var(--muted); font-size: 13px; }
.entry .thumb { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft) center/cover; color: var(--accent);
  display: grid; place-items: center; flex: none; }
.entry h4 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.025em; line-height: 1.3; overflow-wrap: anywhere; }
.entry p { margin: 2px 0 0; font-size: 13px; color: var(--soft); }
.bar { height: 5px; border-radius: 9px; background: var(--line); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; }
.bar.done i { background: var(--green); }
.ticks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tick { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.tick.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
  background: var(--input); border: 1px solid var(--line); white-space: nowrap; }
.st .dot { width: 6px; height: 6px; }
.st.running { color: var(--accent); } .st.running .dot { background: var(--accent); animation: pulse 1.4s infinite; }
.st.done, .st.made { color: var(--green); } .st.done .dot, .st.made .dot { background: var(--green); }
.st.failed, .st.error { color: var(--red); } .st.failed .dot, .st.error .dot { background: var(--red); }
.st.waiting, .st.limits { color: var(--blue); } .st.waiting .dot, .st.limits .dot { background: var(--blue); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .st.running .dot { animation: none; } }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: 16px; margin-bottom: 16px;
  border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 9%, var(--surface)); }
.banner .tile { background: var(--red); color: #fff; }
.banner h4 { margin: 0; font-size: 15px; font-weight: 800; color: var(--red); }
.banner p { margin: 2px 0 0; font-size: 13px; color: var(--soft); }
.banner .bx { margin-left: auto; flex: none; color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.stat { background: var(--surface); padding: 14px 20px; min-width: 0; }
.stat small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; overflow-wrap: anywhere; }

/* ---- video page ---- */
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 14px; }
.back:hover { color: var(--accent); }
.vhead { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.vhead h1 { margin-bottom: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.vhead .actions { flex-basis: 100%; }
.vhead .actions .end { margin-left: auto; }
.btn.icon { width: 38px; padding: 0; justify-content: center; }
.ytgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 16px 20px 20px; }
.ytc { display: flex; flex-direction: column; gap: 6px; }
.imw { position: relative; }
.imw .im { display: block; width: 100%; }
.pick { position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px;
  background: rgba(12,19,34,.72); cursor: pointer; }
.pick input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.ytc.ok .im { outline: 3px solid var(--accent); outline-offset: 1px; }
/* "Redo images" mode: the whole picture is the tap target; a ring when not picked, a filled check when picked */
.redohint { display: flex; align-items: center; gap: 8px; margin: 12px 20px 0; padding: 10px 12px; border-radius: 10px; font-size: 13px;
  color: var(--text); background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.redohint[hidden] { display: none; }
.redohint .i { color: var(--accent); flex: none; }
.im .tick { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid #fff; background: rgba(12,19,34,.55); color: transparent; transition: background .15s, border-color .15s; }
.im .tick .i { width: 14px; height: 14px; }
.imgs.picking .im:not(.missing):not(.sel):hover .tick { background: rgba(12,19,34,.8); }
.im.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.im.sel .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
.imgs.picking .im.missing { opacity: .4; cursor: not-allowed; }
.ytc b { font-size: 12px; font-weight: 700; color: var(--soft); }
video { width: 100%; display: block; background: #000; aspect-ratio: 16/9; }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 16px 20px 20px; }
.im { position: relative; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: var(--input) center/cover; cursor: pointer;
  border: 1px solid var(--line); padding: 0; }
.im:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.im .no { position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 700; background: rgba(12,19,34,.72); color: #fff; padding: 0 6px; border-radius: 6px; }
.imgs.tall { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.imgs.tall .im { aspect-ratio: 9/16; }
.im.missing { border: 1.5px dashed var(--line); background: none; display: grid; place-items: center; color: var(--muted); font-size: 12px; font-weight: 600; }
.im.missing .no { display: none; }
.segs { border-top: 1px solid var(--line); }
.chans { margin-bottom: 26px; }
.sets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.sets .stat b { font-size: 15px; letter-spacing: -.01em; }
.sets .wide { grid-column: 1/-1; }
.sets .full { grid-column: 1/-1; }
.sets .wide b { font-weight: 500; font-size: 13px; color: var(--soft); }
details.rules { border-top: 1px solid var(--line); }
details.rules summary { padding: 12px 20px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--accent); }
.md { padding: 0 20px 16px; font-size: 13px; color: var(--soft); }
.md h4 { margin: 14px 0 4px; font-size: 14px; font-weight: 800; color: var(--text); }
.md ul { margin: 4px 0; padding-left: 18px; }
.md li { margin: 3px 0; }
.md.story { padding-top: 14px; font-size: 14px; line-height: 1.65; }
.md.story p { margin: 0 0 10px; color: var(--text); max-width: 72ch; }
.md p { margin: 4px 0; }
code { font-size: 12px; background: var(--input); border-radius: 5px; padding: 0 4px; overflow-wrap: anywhere; }

/* ---- short channels: weekly pipeline + sources ---- */
.pipe { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); counter-reset: step; }
.pipe li { background: var(--surface); padding: 14px 20px 16px; min-width: 0; display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 10px; row-gap: 4px; align-content: start; }
.pipe li::before { counter-increment: step; content: counter(step); grid-row: span 3; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--input); border: 1px solid var(--line); color: var(--soft); }
.pipe li.now::before { background: var(--accent); border-color: var(--accent); color: #fff; }
.pipe li.ok::before { background: color-mix(in srgb, var(--green) 16%, var(--surface)); border-color: color-mix(in srgb, var(--green) 45%, transparent); color: var(--green); }
.pipe h4 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: -.015em; line-height: 1.3; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pipe h4 small { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.pipe .st { justify-self: start; }
.pipe p { margin: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.srcbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.srcbar .sp { flex: 1; }
.srcbar select { height: 30px; border-radius: 99px; border: 1px solid var(--line); background: var(--input); color: var(--text); font: 600 12px Poppins, sans-serif; padding: 0 10px; max-width: 100%; }
.srclive { display: flex; gap: 10px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--soft); background: var(--accent-soft); }
.srclive span:last-child { overflow-wrap: anywhere; min-width: 0; }
.srcs { list-style: none; margin: 0; padding: 0; }
.srcs li { display: grid; grid-template-columns: 124px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 20px; border-bottom: 1px solid var(--line); }
.srcs li:last-child { border-bottom: 0; }
.srcs a.t { font-size: 14px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.srcs a.t:hover { color: var(--accent); }
.srcs p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.st.skip { color: var(--muted); }
dialog .tx { font-size: 14px; line-height: 1.65; color: var(--soft); background: var(--input); border-radius: 12px; padding: 12px 14px; max-height: 55vh; overflow: auto; white-space: pre-wrap; margin: 0 0 14px; }
.btn:focus-visible, .srcbar select:focus-visible, .srcs a.t:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- short channel page: wide layout ---- */

.chhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 4px 0 6px; }
.chhead h1 { margin: 0; font-size: clamp(28px, 2.6vw, 40px); }
.nowline { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 15px; color: var(--soft); }
.nowline b { color: var(--text); font-weight: 700; }
.track { list-style: none; margin: 0 0 22px; padding: 18px 22px 20px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px; counter-reset: stn; }
.stn { position: relative; padding-right: 18px; min-width: 0; }
.stn::before { counter-increment: stn; content: counter(stn); position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-size: 14px; font-weight: 800; background: var(--input); border: 2px solid var(--line); color: var(--muted); margin-bottom: 10px; }
.stn::after { content: ""; position: absolute; top: 16px; left: 40px; right: 4px; height: 2px; background: var(--line); }
.stn:last-child::after { display: none; }
.stn.ok::before { content: "\2713"; background: color-mix(in srgb, var(--green) 18%, var(--surface)); border-color: var(--green); color: var(--green); }
.stn.ok::after { background: color-mix(in srgb, var(--green) 55%, transparent); }
.stn.now::before { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 5px var(--accent-soft); }
.stn.off::before { border-style: dashed; }
.stn h4 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: -.015em; line-height: 1.3; }
.stn h4 small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-top: 1px; }
.stn .st { margin-top: 8px; }
.stn p { margin: 6px 0 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(340px, 1fr); gap: 22px; align-items: start; }
.cols > aside { position: sticky; top: 64px; }
.cols .search { margin-bottom: 10px; }

@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .cols > aside { position: static; }
  .track { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 18px; } .stn:nth-child(3)::after { display: none; } }

.track.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.facts { list-style: none; margin: 0; padding: 6px 20px 14px; }

details.fold { margin-top: 16px; }
details.fold > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;
  color: var(--soft); padding: 8px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); margin-bottom: 12px; }

.side-script .md.story { max-height: 56vh; overflow: auto; font-size: 13px; }

/* ---- tables ---- */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  padding: 10px 20px; border-bottom: 1px solid var(--line); white-space: nowrap; }

.days { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
.days i { width: 9px; background: var(--accent); border-radius: 3px 3px 1px 1px; min-height: 2px; opacity: .85; }
.days i.z { background: var(--line); }
.wl { width: 150px; white-space: nowrap; }
.feed { list-style: none; margin: 0; padding: 6px 20px 14px; font-size: 13px; }

.feed li:last-child { border-bottom: 0; }

.feed b { font-weight: 600; flex: none; }
.feed span { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.feed .bad b { color: var(--red); }

/* ---- modal ---- */
dialog { border: 1px solid var(--line); border-radius: 24px; padding: 0; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); color: var(--text); }
dialog::backdrop { background: rgba(8,12,22,.6); }
dialog img { width: 100%; display: block; aspect-ratio: 16/9; max-height: 52vh; object-fit: contain; background: #000; }
dialog .ph { aspect-ratio: 16/9; max-height: 52vh; display: grid; place-items: center; background: var(--input); color: var(--muted); font-weight: 600; }
dialog .mb { padding: 16px 20px 20px; }
dialog .mh { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 8px; }
dialog .scene { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
dialog h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.025em; }
dialog .say { font-size: 15px; margin: 0 0 12px; }
dialog .prompt { font-size: 12px; color: var(--soft); background: var(--input); border-radius: 12px; padding: 10px 12px; max-height: 160px; overflow: auto; white-space: pre-wrap; margin: 0 0 14px; }
dialog .edtx { display: block; width: 100%; height: 68vh; resize: vertical; box-sizing: border-box; font: 13px/1.6 ui-monospace, Consolas, monospace; color: var(--text); background: var(--input); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
dialog .edtx:focus-visible { outline: 2px solid var(--accent, #f97316); outline-offset: 2px; }
dialog .row {display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50; background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.toast.bad { background: var(--red); color: #fff; display: flex; align-items: center; gap: 10px; }
.toast .bx { width: 30px; height: 30px; flex: none; background: transparent; color: #fff; border-color: rgba(255,255,255,.55); }
.toast .bx:hover:not(:disabled) { background: #fff; color: var(--red); }

/* ---- small screens ---- */
@media (max-width: 860px) {
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 720px) {
  .side { transform: translateX(-100%); transition: transform .2s ease; width: 240px; }
  body.nav-open .side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .main { margin-left: 0; }

  .qs { display: none; }

  .top .runpill .lbl { display: none; }
  .page { padding: 24px 16px 70px; }
  .grid3 { grid-template-columns: minmax(0, 1fr); padding: 10px 16px 14px; }

  .vrow { flex-direction: column; align-items: stretch; gap: 10px; }
  .vrow .info { width: auto; }
  .ytgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px 16px 16px; gap: 10px; }

  .tbl.stack thead { display: none; }

  .tbl.stack td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: 12px; }

  .feed time { width: 54px; }
  .wl { width: auto; white-space: normal; }
}

<body>
<aside class="side" id="side">
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span>Yt<b>Automation</b></span></div>
  <nav class="nav" id="nav">
    <a href="#/" data-p="videos" id="navVideos"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Scripts &amp; videos</a>
    <a href="#/live" data-p="live"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Live run<span class="n" id="liveN" hidden>1</span></a>
    <a href="#/accounts" data-p="accounts"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Accounts</a>
    <a href="#/runs" data-p="runs"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Runs</a>
  </nav>
  <div class="svc yt" id="svc"></div>
  <div class="svc js" id="jsvc"></div>
  <div class="foot nav">
    <a href="http://127.0.0.1:5678/workflow/ytrender00000001" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>Open in n8n</a>
  </div>
</aside>

<div class="main">
  <header class="top">
    <button class="ib menu" id="menuBtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <h2 id="topTitle">Scripts &amp; videos</h2>
    <div class="sp"></div>
    <label class="qs"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="qs" placeholder="Search scripts and videos…" aria-label="Search scripts and videos"><kbd>Ctrl K</kbd></label>
    <span class="pill runpill" id="runPill"></span>
    <button class="btn sm danger" id="stopTop" hidden><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>Stop</button>
    <button class="ib" id="refresh" aria-label="Refresh" title="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
    <button class="ib" id="theme" aria-label="Toggle dark mode" title="Light / dark"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>
  <main class="page" id="page"></main>
</div>

<dialog id="dlg"></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pad = n => String(n).padStart(3, '0');
const ic = {
  film: '<svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>',
  play: '<svg class="i" viewBox="0 0 24 24"><path d="m6 4 14 8-14 8z"/></svg>',
  stop: '<svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>',
  pause: '<svg class="i" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>',
  img: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
  pulse: '<svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  doc: '<svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  users: '<svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  back: '<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  dl: '<svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
  trash: '<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  redo: '<svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>',
};
const STATUS = { running: 'Running', waiting: 'Waiting', failed: 'Failed', done: 'Done', draft: 'Story to approve' };
const ORDER = ['running', 'failed', 'waiting', 'draft', 'done'];
const SUB = { running: 'Being made right now.', waiting: 'Script ready; the next run or the 5-hour timer picks these up.',
  failed: 'The last run stopped with an error.',
  done: 'MP4 made. Watch, then upload by hand.', draft: 'Story written (script.md). Approve it, then Claude builds script.json.' };

let S = null, filter = 'all', query = '', V = null, vFilter = 'all', chan = 'jin', rulesOpen = false, srcWeek = {}, setOpen = false;

// ---------- helpers ----------
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Dash': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'bad answer from the dashboard server' }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, bad) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  if (bad) t.insertAdjacentHTML('beforeend', trashBtn(''));
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 9000 : 5000);
}
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : m ? `${m} min` : `${s} s`; };
const when = iso => { const d = new Date(iso); const today = new Date().toDateString() === d.toDateString();
  return (today ? '' : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ') + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };
const ago = t => dur(Date.now() / 1000 - t) + ' ago';
const st = (k, label) => `<span class="st ${k}"><i class="dot"></i>${esc(label || STATUS[k] || k)}</span>`;
const bar = v => `<div class="bar ${v.made >= v.total && v.total ? 'done' : ''}"><i style="width:${v.total ? Math.round(100 * v.made / v.total) : 0}%"></i></div>`;
const ticks = v => `<div class="ticks">${[['voice', v.voiceDone], ['subtitles', v.srt], ['MP4', v.mp4]].map(([n, ok]) => `<span class="tick ${ok ? 'ok' : ''}">${ok ? '✓ ' : ''}${n}</span>`).join('')}</div>`;
const runLabel = r => r.live ? ['running', 'Running'] : r.outcome === 'made' ? ['made', 'MP4 made'] : r.outcome === 'failed' ? ['failed', 'Failed']
  : r.outcome === 'limits' ? ['limits', 'Out of credits'] : r.outcome === 'stopped' ? ['', 'Stopped'] : r.outcome === 'skipped' ? ['', 'Skipped']
  : r.status === 'error' ? ['error', 'Error'] : r.status === 'success' ? ['done', 'Finished'] : ['', r.status];

// ---------- shell ----------
function shell() {
  const h = S.health;
  const svc = [['n8n', h.n8n ? 'on' : ['starting', 'restarting'].includes(h.n8nState) ? 'idle' : 'off', h.n8nState || (h.n8n ? 'running' : 'down')], ['Bridge', h.bridge ? 'on' : 'off', h.bridge ? 'running' : 'down'],
    ['OpenCut', h.opencut ? 'on' : 'idle', h.opencut ? 'running' : 'idle']];
  for (const [k, n] of APPS) { const a = h.apps?.[k] || {}; svc.push([n, a.on ? 'on' : 'idle', a.on ? 'running' : a.starting ? 'starting' : 'down']); }
  const restarting = h.n8nState === 'restarting';
  $('#svc').innerHTML = `<p class="t">YtAutomation</p>` + svc.map(([n, c, t]) => `<div><strong>${n}</strong><span title="${n === 'OpenCut' && !h.opencut ? 'Starts by itself when a video is rendered' : t}"><span class="dot ${c}"></span> ${t}</span></div>`).join('')
    + `<button class="btn sm" data-n8n ${S.run || restarting ? 'disabled' : ''} title="${S.run ? 'A run is going; stop it first' : 'Ends n8n, even when it is frozen, and starts it again in its own minimised window. Takes about 3 minutes.'}">${restarting ? 'Restarting n8n…' : 'Restart n8n'}</button>`
    + APPS.map(([k, n, port, tip]) => { const a = h.apps?.[k] || {};
      return `<button class="btn sm primary" data-app="${k}" ${a.starting ? 'disabled' : ''} title="${tip} (http://127.0.0.1:${port}). ${a.on ? 'Opens it.' : 'Starts it in its own minimised window; close that window to stop it.'}">${a.starting ? `Starting ${n}…` : n}</button>`; }).join('');
  const j = h.jobstash || {};
  $('#jsvc').innerHTML = `<p class="t">TheJobStash</p>` + [['Scorer', j.scorer], ['Tunnel', j.tunnel]].map(([n, on]) =>
    `<div><strong>${n}</strong><span><span class="dot ${on ? 'on' : j.starting ? 'idle' : 'off'}"></span> ${on ? 'running' : j.starting ? 'starting' : 'down'}</span></div>`).join('')
    + (j.scorer && j.tunnel ? '' : `<button class="btn sm primary" data-js ${j.starting ? 'disabled' : ''} title="Closes any old scorer and tunnel windows, then starts both fresh, each in its own minimised window.">${j.starting ? 'Starting…' : 'Start'}</button>`);
  const r = S.run;
  $('#runPill').innerHTML = r ? `<span class="dot on" style="background:var(--accent)"></span><span class="lbl">${esc(r.slug || 'starting')}${r.video ? ` · ${r.video.made}/${r.video.total}` : ''}</span>`
    : robot() ? `<span class="dot off"></span><span class="lbl">Robot check</span>` : `<span class="dot idle"></span><span class="lbl">Idle</span>`;
  $('#stopTop').hidden = !r;
  $('#liveN').hidden = !r;
}

function route() {
  const h = location.hash.slice(1) || '/';
  const [, p, arg] = h.split('/');
  document.body.classList.remove('nav-open');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === (p === 'video' ? 'videos' : p || 'videos')));
  if ((p || 'videos') === 'videos' && arg) chan = decodeURIComponent(arg);
  $('#navVideos').href = '#/videos/' + encodeURIComponent(chan);
  return { p: p || 'videos', arg: decodeURIComponent(arg || '') };
}

async function render() {
  if (!S) return;
  shell();
  const { p, arg } = route();
  const titles = { videos: 'Scripts & videos', live: 'Live run', accounts: 'Accounts', runs: 'Runs', video: 'Script' };
  $('#topTitle').textContent = titles[p] || 'Scripts & videos';
  const page = $('#page');
  if (p === 'video') return renderVideo(arg);
  V = null;
  page.innerHTML = p === 'live' ? live() : p === 'accounts' ? accountsPage() : p === 'runs' ? runsPage() : videosPage();
  if (p === 'videos') bindVideos();
  const ls = $('#liveStop'); if (ls) ls.onclick = () => act('stop');
}

// ---------- deleted notices ----------
// Every error notice has a trash button; a deleted one stays hidden in this browser (only that notice: a new run's
// error shows again). Keys: robot:<run>, run:<run>, script:<slug>:<error>.
const goneSet = () => { try { return new Set(JSON.parse(localStorage.getItem('gone') || '[]')); } catch (e) { return new Set(); } };
const isGone = k => goneSet().has(k);
function forget(k) {
  try { const g = goneSet(); g.add(k); localStorage.setItem('gone', JSON.stringify([...g].slice(-300))); } catch (e) {}
}
// the robot notice deleted before this list existed stays deleted
try { const old = localStorage.getItem('robotGone'); if (old) { forget('robot:' + old); localStorage.removeItem('robotGone'); } } catch (e) {}
const trashBtn = k => `<button class="btn icon bx" data-gone="${esc(k)}" aria-label="Delete this message" title="Delete this message">${ic.trash}</button>`;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-gone]');
  if (!b) return;
  e.preventDefault();
  if (b.dataset.gone) forget(b.dataset.gone);
  const box = b.closest('.banner, .toast');
  if (box) box.remove();
  if (S) shell();
});

// ---------- videos ----------
const robot = () => S.robot && !isGone('robot:' + S.robot.id) ? S.robot : null;
function robotBanner() {
  const r = robot();
  return r ? `<div class="banner"><span class="tile">${ic.alert}</span><div><h4>Google's robot check is showing</h4>
    <p>Run ${esc(r.id)} on <b>${esc(r.slug)}</b> stopped at ${when(r.stoppedAt)}. Solve it in the Gemini window, then press Start on the script.</p></div>
    ${trashBtn('robot:' + r.id)}</div>` : '';
}
function liveCard(onLive) {

// "Redo images" mode: on, a click anywhere on a made picture picks it; the button again redoes the picked ones.
// Kept across the page's auto-refresh, dropped when another video opens.
let redoOn = false, redoPick = new Set(), redoSlug = '';
const redoOff = () => { redoOn = false; redoPick = new Set(); drawImgs(); };
function drawImgs() {
  if (!$('#imgs')) return;                            // a script still waiting for approval has no pictures card
  if (redoSlug !== V.slug) { redoOn = false; redoPick = new Set(); redoSlug = V.slug; }
  if (V.mp4 || S.run) redoOn = false;
  if (!redoOn) redoPick.clear();
  for (const id of redoPick) if (!V.segments.some(s => s.id === id && s.v)) redoPick.delete(id);
  const segs = V.segments.filter(s => vFilter === 'all' || (vFilter === 'made') === !!s.v);
  $('#imgs').classList.toggle('picking', redoOn);
  $('#imgs').innerHTML = segs.map(s => s.v
    ? `<button class="im${redoPick.has(s.id) ? ' sel' : ''}" data-id="${s.id}" style="background-image:url('/thumb/${encodeURIComponent(V.slug)}/${s.id}?v=${s.v}')" title="${esc(s.text)}" aria-label="Image ${pad(s.id)}"${redoOn ? ` aria-pressed="${redoPick.has(s.id)}"` : ''}><span class="no">${pad(s.id)}</span>${redoOn ? `<span class="tick" aria-hidden="true">${ic.check}</span>` : ''}</button>`
    : `<button class="im missing" data-id="${s.id}" title="${esc(s.text)}" aria-label="Image ${pad(s.id)}, not made yet"${redoOn ? ' disabled' : ''}>${pad(s.id)}</button>`).join('')
    || `<div class="empty" style="grid-column:1/-1">Nothing here.</div>`;
  $('#imgs').onclick = e => {
    const b = e.target.closest('.im'); if (!b) return;
    if (!redoOn) return openImg(+b.dataset.id);
    const id = +b.dataset.id, on = !redoPick.has(id);
    on ? redoPick.add(id) : redoPick.delete(id);
    b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); redoBtn();
  };
  const hint = $('#redoHint'); if (hint) hint.hidden = !redoOn;
  redoBtn();
}
function redoBtn() {
  const b = $('#redoSel'); if (!b) return;
  const n = redoPick.size, run = !!S.run;
  b.disabled = run;
  b.classList.toggle('primary', redoOn);
  b.setAttribute('aria-pressed', redoOn);
  b.title = run ? 'Stop the run first' : !redoOn ? 'Pick pictures to make again' : n ? `Make the ${n} picked picture${n > 1 ? 's' : ''} again` : 'Nothing picked; press to leave';
  b.innerHTML = `${ic.redo}${!redoOn ? 'Redo images' : n ? `Redo ${n} image${n > 1 ? 's' : ''}` : 'Pick pictures…'}`;
  $('#redoCancel').hidden = !redoOn;
  $('#redoCancel').onclick = redoOff;
  b.onclick = async () => {
    if (!redoOn) { redoOn = true; drawImgs(); $('#imgs').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
    if (!n) return redoOff();
    const ids = [...redoPick].sort((a, x) => a - x);
    if (!confirm(`Make ${ids.length} image${ids.length > 1 ? 's' : ''} again (${ids.map(id => pad(id)).join(', ')})? The current ones move to img/redo/ and the next run makes new ones.`)) return;
    b.disabled = true; b.innerHTML = `${ic.redo}Redoing…`;
    const bad = [];
    for (const id of ids) {
      try { await api('/api/redo', { slug: V.slug, id }); }
      catch (e) { bad.push(`${pad(id)}: ${e.message}`); }
    }
    toast(bad.length ? `Could not redo ${bad.join('; ')}` : `${ids.length} image${ids.length > 1 ? 's' : ''} moved to img/redo/; the next run makes them again`, !!bad.length);
    redoOn = false; redoPick = new Set();

  };
}
addEventListener('keydown', e => { if (e.key === 'Escape' && redoOn && !$('#dlg').open) redoOff(); });
function openImg(id) {

  d.innerHTML = `${s.v ? `<img src="/img/${encodeURIComponent(V.slug)}/${id}?v=${s.v}" alt="Image ${pad(id)}">` : `<div class="ph">Image ${pad(id)} is not made yet</div>`}
    <div class="mb"><div class="mh"><h3>Image ${pad(id)}</h3><div class="row">${s.v && !V.mp4 ? `<button class="btn sm danger" id="redo">${ic.redo}Make again</button>` : ''}<button class="btn sm" id="close">Close</button></div></div>

function openEdit() {
  const d = $('#dlg'), was = V.story;
  d.innerHTML = `<div class="mb"><div class="mh"><h3>Edit script</h3><div class="row"><button class="btn sm" id="close">Cancel</button><button class="btn sm primary" id="save">${ic.check}Save</button></div></div>
    <label for="edtx" class="scene">The narration at the top is what the voice says. The numbered lines under “Lines and pictures” must say the same words, in order: <b>line</b> — picture.</label>
    <textarea id="edtx" class="edtx" spellcheck="true"></textarea></div>`;
  $('#edtx').value = was;
  const dirty = () => $('#edtx').value !== was;
  const leave = e => { if (dirty() && !confirm('Close without saving? Your changes are lost.')) { e && e.preventDefault(); return false; } return true; };
  d.oncancel = leave;                                 // Esc
  d.showModal();
  $('#edtx').focus(); $('#edtx').setSelectionRange(0, 0); $('#edtx').scrollTop = 0;

const d0 = $('#dlg'); d0.addEventListener('click', e => { if (e.target === d0 && (!d0.oncancel || d0.oncancel() !== false)) d0.close(); });

async function act(a, slug) {
  try {
    if (a === 'start') {
      if (!confirm(`Start making "${slug}" now?`)) return;
      toast((await api('/api/start', { slug })).message);
    } else if (a === 'edit') {
      openEdit();
    } else if (a === 'approve') {
      if (!confirm('Approve this script? Its lines and picture prompts are built, and it is ready to Start.')) return;
      toast((await api('/api/approve', { slug })).message);
    } else if (a === 'stop') {
      if (!confirm('Stop the run? n8n stops, the video is released and every Gemini window closes. Images already saved stay.')) return;
      toast('Stopping… the runner finishes its current order, then closes the windows.');
      toast((await api('/api/stop', {})).message);
    } else if (a === 'delete') {
      const typed = prompt(`This permanently deletes what was made for ${slug}: images, voice, subtitles, MP4 and thumbnails. It cannot be undone.
The script (script.md, script.json), sources and refs are kept, so the video can be made again.

Type ${slug} to delete it.`);
      if (typed === null) return;
      toast((await api('/api/delete', { slug, typed })).message);
      location.hash = '#/';
      return refresh(true);
    }
  } catch (e) { toast(e.message, true); }
  refresh(true);
}

      <td data-l="Took" style="white-space:nowrap">${dur(((r.stoppedAt ? new Date(r.stoppedAt) : Date.now()) - new Date(r.startedAt)) / 1000)}</td>
      <td data-l="Result">${st(k, l)}${r.reason && r.outcome !== 'made' ? `<div class="muted" style="font-size:12px;margin-top:4px;max-width:520px">${esc(r.reason)}</div>` : ''}</td>
      <td data-l="n8n"><a class="muted" href="http://127.0.0.1:5678/workflow/${encodeURIComponent(r.workflowId || 'ytrender00000001')}/executions/${encodeURIComponent(r.id)}" target="_blank" rel="noopener">Run ${esc(r.id)}</a></td></tr>`; }).join('')}
    </tbody></table>` : `<div class="empty">${S.health.n8n ? 'No runs yet.' : 'n8n is not running.'}</div>`}</section>`;
}

// ---------- loop ----------
let busy = false, lastSig = '', lastVSig = '', seq = 0;
async function refresh(force) {
  if (busy && !force) return;
  busy = true;
  const my = ++seq;                                   // an older answer arriving late must not overwrite a newer one
  try {
    const next = await api('/api/state');
    if (my !== seq) return;
    const sig = JSON.stringify({ ...next, now: 0 });
    const same = sig === lastSig;
    S = next; lastSig = sig;
    const { p, arg } = route();
    if (p === 'video') {
      // redraw only when this video changed, so a playing MP4 or an open grid is not rebuilt every 5 s
      shell();
      const v = await api('/api/video?slug=' + encodeURIComponent(arg));
      if (my !== seq) return;
      const vsig = JSON.stringify([v, (S.videos.find(x => x.slug === arg) || {}).status, !!S.run, S.health.n8n]);
      if (force || vsig !== lastVSig) await renderVideo(arg, true);
    } else if (same && !force) shell();
    else if (p === 'videos' && $('#groups')) {          // keep the search box focused while typing
      shell();
      const focus = document.activeElement && document.activeElement.id === 'q';
      const caret = focus && $('#q').selectionStart;
      $('#page').innerHTML = videosPage(); bindVideos();
      if (focus) { $('#q').focus(); $('#q').setSelectionRange(caret, caret); }
    } else render();
  } catch (e) { if (my === seq) toast('Dashboard server not answering: ' + e.message, true); }
  finally { if (my === seq) busy = false; }
}
window.addEventListener('hashchange', () => { scrollTo(0, 0); render(); });
$('#refresh').onclick = () => refresh(true);
$('#stopTop').onclick = () => act('stop');
$('#svc').onclick = async e => {
  const v = e.target.closest('[data-app]');
  if (v && !v.disabled) return voiceApp(v);
  const b = e.target.closest('[data-n8n]');
  if (!b || b.disabled) return;
  if (!confirm("Restart n8n? It is down for about 3 minutes. TheJobStash's workflows run on the same n8n and pause too.")) return;
  b.disabled = true;
  try { toast((await api('/api/n8n/restart', {})).message); } catch (err) { toast(err.message, true); }
  refresh(true);
};
// Local voice pages, not part of the video pipeline: key, name, port, what it is.
const APPS = [['kokoro', 'Kokoro', 7860, 'Kokoro text to speech: 28 voices, paste a script, get a WAV'],
              ['chatterbox', 'Chatterbox', 7861, 'Chatterbox: copies any voice clip (Liam, your recording...), emotion and pace sliders']];
// The tab is opened inside the click (a later window.open is blocked as a pop-up), then pointed at the page once it answers.
async function voiceApp(b) {
  const [k, n, port] = APPS.find(a => a[0] === b.dataset.app), url = `http://127.0.0.1:${port}/`;
  if (S.health.apps?.[k]?.on) return window.open(url, '_blank');
  const w = window.open('', '_blank');
  const say = t => { if (w && !w.closed) w.document.body.innerHTML = `<p style="font:16px system-ui;padding:24px">${t}</p>`; };
  if (w) { w.document.title = n; say(`Starting ${n}…`); }
  b.disabled = true;
  try { toast((await api('/api/app/start', { app: k })).message); } catch (err) { toast(err.message, true); w?.close(); return refresh(true); }
  for (let i = 0; i < 60; i++) {                       // up to 90 s (Chatterbox imports torch before the page answers)
    await new Promise(r => setTimeout(r, 1500));
    await refresh(true);
    if (S.health.apps?.[k]?.on) { if (w && !w.closed) w.location = url; else window.open(url, '_blank'); return; }
  }
  say(`${n} did not start in 90 s. Check its minimised window "${n} :${port}".`);
}
$('#jsvc').onclick = async e => {
  const b = e.target.closest('[data-js]');
  if (!b || b.disabled) return;
  b.disabled = true;
  try { toast((await api('/api/jobstash/start', {})).message); } catch (err) { toast(err.message, true); }
  refresh(true);
};
$('#menuBtn').onclick = () => document.body.classList.toggle('nav-open');
$('#qs').oninput = e => { query = e.target.value; if (route().p !== 'videos') location.hash = '#/'; else { $('#q').value = query; groups(); } };
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); (innerWidth > 720 ? $('#qs') : ($('#q') || $('#qs'))).focus(); } });
$('#theme').onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
refresh(true);
setInterval(() => { if (!document.hidden && !$('#dlg').open) refresh(); }, 5000);
</script>
